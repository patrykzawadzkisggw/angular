<div *ngIf="showBanner" class="fixed inset-x-0 bottom-0 z-50 bg-white border-t border-gray-200 shadow-lg py-3">
  <div class="max-w-6xl mx-auto px-4 flex items-center justify-between gap-4">
    <div class="text-sm text-gray-700">Projekt na fakultek z Angulara. Autorzy: Patryk Zawadzki, Jakub Załuska, Karolina Trzakulska</div>
    <div class="flex items-center gap-2">
      <button pButton type="button" label="Akceptuję" class="p-button-sm p-button-raised" (click)="acceptAll()"></button>
    </div>
  </div>
</div>
