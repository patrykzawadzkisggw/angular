<p-card>
    <div class="card">
        <div class="order">
            <span class="title block">{{ order.status }}</span>
            <span class="block b600">{{ order.date }}</span>
        </div>

        <div class="price">
            <img src="cash.svg" alt="">
            <div>
                <span class="title">{{ order.total }}zł</span>
            </div>
        </div>

        <div class="items">
            <img src="item.svg" alt="">
            <div>
                <span class="title">Elementy</span>
                <span class="b600">{{ order.itemsCount }}x</span>
            </div>
        </div>

        <div class="status">
            <p-tag [severity]="severity" [value]="order.status" [rounded]="true"></p-tag>
        </div>

        <div class="details">
            <span [routerLink]="['/orders', order.id]">Szczegóły <i class="pi pi-external-link"></i></span>
        </div>

        <div class="gallery">
            @for(img of order.images; track img) {
                <img [src]="img" alt="">
            }
        </div>
    </div>
</p-card>
