


<div class="delivery-layout space-y-4 md:grid md:grid-cols-[1fr_300px] md:gap-4 md:space-y-0">
    <p-stepper [value]="2" class="md:col-span-1" (valueChange)="onStepChange($event)">
        <p-step-list>
            <p-step [value]="1"><a routerLink="/cart">Koszyk</a></p-step>
            <p-step [value]="2">Dostawa</p-step>
        </p-step-list>
    </p-stepper>

    <p-card class="delivery-card w-full md:col-start-1 md:row-start-2">
        <div class="delivery-form grid gap-4 grid-cols-1 md:grid-cols-2">
            <p-iftalabel class="w-full">
                <input pInputText id="firstname" autocomplete="off" class="w-full" />
                <label for="firstname">Imie</label>
            </p-iftalabel>

            <p-iftalabel class="w-full">
                <input pInputText id="lastname" autocomplete="off" class="w-full" />
                <label for="lastname">Nazwisko</label>
            </p-iftalabel>

            <p-iftalabel class="w-full">
                <input pInputText id="postcode" autocomplete="off" class="w-full" />
                <label for="postcode">Kod pocztowy</label>
            </p-iftalabel>

            <p-iftalabel class="w-full">
                <input pInputText id="city" autocomplete="off" class="w-full" />
                <label for="city">Miasto</label>
            </p-iftalabel>

            <p-iftalabel class="w-full md:col-span-2">
                <input pInputText id="adres" autocomplete="off" class="w-full" />
                <label for="adres">Ulica i numer domu/mieszkania</label>
            </p-iftalabel>

            <p-button label="Zamów 29.99zł" routerLink="/status" class="w-full md:col-span-2" styleClass="w-full" />
        </div>
    </p-card>

</div>
