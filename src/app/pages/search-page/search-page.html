@if ((loading$ | async)) {
	<div class="w-full h-64 flex items-center justify-center">
		<div class="text-center">
			<div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-gray-300 border-t-violet-600"></div>
			<div class="mt-3 text-gray-600">Ładowanie wyników...</div>
		</div>
	</div>
} @else {
  @if ((categories$ | async)?.length === 0) {
	<app-not-found-page></app-not-found-page>
  } @else {
	@for(category of (categories$ | async); track category.name) {
	<section class="recommendations mt-24">
		<h2 class="mb-4 text-4xl tracking-tight font-extrabold text-gray-900 ">{{ category.name }}</h2>
		<div class="grid grid-cols-[repeat(auto-fill,200px)] gap-5 p-5 pl-0 pr-0">
			@for(product of (category.products); track product.id) {
				<app-product-link [product]="product" />
			}
		</div>
      
	</section>
	}
  }
}
